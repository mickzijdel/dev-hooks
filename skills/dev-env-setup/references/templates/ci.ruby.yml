# Action versions below are a snapshot — verify each `uses:` is at its latest before
# copying (see SKILL.md › "Keeping GitHub Actions current").
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Make bin files executable
        run: chmod +x bin/*
      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Make bin files executable
        run: chmod +x bin/*
      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required to scan pull_request events

  # Noisier audits — mirror the hk `check` hook (not run on pre-commit).
  # Add `flay` and `debride` to the Gemfile dev group.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Dead code (debride)
        run: bundle exec debride .
      - name: Duplication (flay — Ruby structural, advisory)
        run: bundle exec flay . || true   # flay exits 0 anyway; surfaces structural clones
      - name: Duplication (jscpd — polyglot gate)
        # -f scopes to code formats (no config equivalent); .jscpd.json carries
        # minTokens/threshold/reporters/gitignore/ignorePattern (excludes generated
        # db/schema.rb, structure.sql, app/assets/builds).
        # Match the pre-commit jscpd version: latest on a 4-day cooldown, floored at v5
        # (see hk.ruby.pkl / SKILL.md › jscpd version policy) so local and CI gates agree.
        run: |
          cutoff=$(date -u -d '4 days ago' +%F)
          ver=$(npx --before="$cutoff" --yes jscpd --version 2>/dev/null | awk 'END{print $NF}')
          case "$ver" in ''|0.*|1.*|2.*|3.*|4.*) ver=latest;; esac
          npx --yes jscpd@"$ver" . -f ruby,erb,javascript,typescript,css,scss,sass,vue
      - name: Large files
        run: |
          limit=512000
          large=$(git ls-files | while read -r f; do
            s=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$s" -gt "$limit" ]; then echo "$f ($s bytes)"; fi
          done)
          if [ -n "$large" ]; then echo "Files exceed ${limit} bytes:"; echo "$large"; exit 1; fi
