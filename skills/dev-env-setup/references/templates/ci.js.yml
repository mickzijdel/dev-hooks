# Action versions below are a snapshot — verify each `uses:` is at its latest before
# copying (see SKILL.md › "Keeping GitHub Actions current").
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Check formatting (prettier)
        run: npx prettier --check .

  # Run the MIT-licensed gitleaks CLI (via mise, version-pinned in mise.lock) rather than
  # gitleaks/gitleaks-action: the action requires a paid GITLEAKS_LICENSE on org-owned repos,
  # while the CLI is free for all repos and is exactly what the local hk pre-commit hook runs.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks git scans the full commit history
      - uses: jdx/mise-action@v4
      - name: Scan git history for secrets
        run: mise exec -- gitleaks git --redact --no-banner .

  # Add a `test` job here if the project has a test suite (e.g. `npm test` / `npx vitest run`).

  # Noisier audits — mirror the hk `check` hook.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Duplication (jscpd)
        # -f scopes to code formats; .jscpd.json carries minTokens/threshold/reporters/ignore.
        # Match the pre-commit jscpd version: latest on a 4-day cooldown, floored at v5.
        run: |
          cutoff=$(date -u -d '4 days ago' +%F)
          ver=$(npx --before="$cutoff" --yes jscpd --version 2>/dev/null | awk 'END{print $NF}')
          case "$ver" in ''|0.*|1.*|2.*|3.*|4.*) ver=latest;; esac
          npx --yes jscpd@"$ver" . -f javascript,typescript,css,scss
      - name: Large files
        run: |
          limit=512000
          large=$(git ls-files | while read -r f; do
            s=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$s" -gt "$limit" ]; then echo "$f ($s bytes)"; fi
          done)
          if [ -n "$large" ]; then echo "Files exceed ${limit} bytes:"; echo "$large"; exit 1; fi
