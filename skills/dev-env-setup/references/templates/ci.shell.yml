# Action versions below are a snapshot — verify each `uses:` is at its latest before
# copying (see SKILL.md › "Keeping GitHub Actions current").
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: |
          shopt -s globstar nullglob
          shellcheck **/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      # Plugin/script repos: run the test suite for bundled scripts (see readoc's
      # tests/ + pyproject.toml dev project for the preferred pattern).
      - name: Run tests
        run: uv run pytest --tb=short

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  # Noisier audits — mirror the hk `check` hook (not run on pre-commit).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Dead code (vulture, Python incl. extensionless PEP 723 scripts)
        run: |
          # tracked .py + any tracked file with a python/uv shebang (e.g. bin/foo).
          # git ls-files excludes gitignored .venv automatically.
          files=$( { git ls-files '*.py'; git ls-files | xargs -r grep -lE '^#!.*(python|uv run)' 2>/dev/null; } | sort -u )
          if [ -n "$files" ]; then uvx vulture --min-confidence 80 $files; else echo "no python files, skipping"; fi
      - name: Duplication (jscpd)
        run: npx --yes jscpd@latest .   # config in .jscpd.json (ai + threshold reporters)
      - name: Large files
        run: |
          limit=512000
          large=$(git ls-files | while read -r f; do s=$(stat -c%s "$f" 2>/dev/null || echo 0); [ "$s" -gt "$limit" ] && echo "$f ($s bytes)"; done)
          if [ -n "$large" ]; then echo "Files exceed ${limit} bytes:"; echo "$large"; exit 1; fi
