[tools]
hk = "latest"
pkl = "latest"
uv = "latest"
gitleaks = "latest"
node = "latest"            # provides npx, used to run jscpd 5.x (`npx --yes jscpd@latest`)
# jscpd (duplication) runs via npx — see hk.pkl / .jscpd.json. It is NOT a mise tool: jscpd 5.x
# is a Rust binary distributed through npm optional platform packages, which npx resolves but the
# mise npm backend does not. vulture (dead-code) is a dev dependency, run via `uv run vulture`.

[env]
# dev-env standard version this repo targets (dev-hooks:dev-env-setup). Do not
# hand-edit — bump it by running the skill's upgrade path.
DEV_ENV_VERSION = "1"
