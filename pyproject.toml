# Dev-tooling manifest only (readoc-style). The plugin's scripts/CLIs stay
# self-contained — the Python ones use PEP 723 inline deps and run via `uv run --script`
# (shebang: #!/usr/bin/env -S uv run --script). This file exists purely so contributors
# get a reproducible test/lint environment; it declares no runtime dependencies and is
# never built or installed (package = false).
[project]
name = "dev-hooks"
version = "0.0.0"
description = "Dev tooling for the dev-hooks Claude Code plugin."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "vulture",   # dead-code audit; run via `uvx vulture`
    # The bundled Python scripts are stdlib-only (PEP 723 deps = []), so there is
    # nothing extra to mirror here for the test environment to import.
]

[tool.uv]
package = false
# Dependency cooldown (dev-env standard v6): don't resolve a release until it's been public
# ≥4 days, so a malicious upload is caught/yanked before it lands here. Rolling duration, so the
# window moves with today's date. Urgent override: exclude-newer-package = { foo = "0 days" }.
exclude-newer = "4 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# requires-python above is the floor for THIS repo's tooling; the scripts the plugins ship
# run on the user's python3 and declare their own floor, 3.12, in PEP 723 headers. Left to
# infer 3.14, ruff format emits 3.14-only syntax (unparenthesized `except A, B:`) that
# those scripts cannot parse. tests/test_python_floor.py holds each file to its floor.
target-version = "py312"
