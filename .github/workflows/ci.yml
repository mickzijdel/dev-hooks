name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4   # provides shellcheck + shfmt (mirrors the hk linters)
      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          shellcheck **/*.sh
      - name: shfmt
        run: shfmt -d .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      # Plugin/script repo: run the test suite that exercises every bundled script
      # (the Python skill CLIs and the shell hooks) as subprocesses.
      - name: Run tests
        run: uv run pytest --tb=short

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3

  # Noisier audits — mirror the hk `check` hook (not run on pre-commit).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Dead code (vulture, Python incl. extensionless PEP 723 scripts)
        run: |
          # tracked .py + any tracked file with a python/uv shebang (e.g. bin/foo).
          # git ls-files excludes gitignored .venv automatically.
          files=$( { git ls-files '*.py'; git ls-files | xargs -r grep -lE '^#!.*(python|uv run)' 2>/dev/null; } | sort -u )
          if [ -n "$files" ]; then uvx vulture --min-confidence 80 $files; else echo "no python files, skipping"; fi
      - name: Duplication (jscpd)
        # -f python,bash scopes detection to real code; the repo's only other files are
        # template scaffolding / doc tables that duplicate by design, and jscpd 5.x ignores
        # the config `ignore` list. config (minTokens/threshold/reporters) in .jscpd.json.
        # Match the pre-commit jscpd version: latest on a 4-day cooldown, floored at v5
        # (see hk.pkl / dev-env-setup SKILL.md › jscpd version policy) so local and CI gates agree.
        run: |
          cutoff=$(date -u -d '4 days ago' +%F)
          ver=$(npx --before="$cutoff" --yes jscpd --version 2>/dev/null | awk 'END{print $NF}')
          case "$ver" in ''|0.*|1.*|2.*|3.*|4.*) ver=latest;; esac
          npx --yes jscpd@"$ver" . -f python,bash
      - name: Large files
        run: |
          limit=512000
          large=$(git ls-files | while read -r f; do
            s=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$s" -gt "$limit" ]; then echo "$f ($s bytes)"; fi
          done)
          if [ -n "$large" ]; then echo "Files exceed ${limit} bytes:"; echo "$large"; exit 1; fi
