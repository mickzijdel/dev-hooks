# mise-driven devcontainer compose (dev-hooks:dev-env-setup standard).
# Accessory services (DB, cache, ...) start automatically via the app service's `depends_on`,
# so the developer never "starts" them — opening the folder in the container is enough.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    volumes:
      # KNOB — workspace path: match Dockerfile WORKDIR + devcontainer.json workspaceFolder.
      - ..:/workspaces/app:cached
      # KNOB — dependency cache volume (persists installed deps across rebuilds). Pick per stack:
      #   Ruby:   bundle-cache:/bundle           (with BUNDLE_PATH: /bundle/vendor below)
      #   Node:   node-modules:/workspaces/app/node_modules
      #   Python: uv-cache:/home/vscode/.cache/uv
      #   Go:     go-mod:/home/vscode/go/pkg/mod
      - bundle-cache:/bundle
      # Persist the mise toolchain (runtime + hk/...) across rebuilds so any one-time from-source
      # compile in `mise install` is not repeated. Path matches MISE_DATA_DIR in the Dockerfile.
      - mise-data:/home/vscode/.local/share/mise
    command: sleep infinity
    environment:
      # KNOB — per stack / accessory services. The DB_* vars below match the `mysql` example.
      BUNDLE_PATH: /bundle/vendor
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      # KNOB — accessory services this project needs (drop if none).
      - mysql
    ports:
      # Host publish tracks $PORT so parallel per-worktree devcontainers don't clash on one host
      # port (worktree-setup's isolate writes PORT into .devcontainer/.env; compose reads it).
      # Falls back to 3000 when $PORT is unset (the plain, single-checkout case).
      - "${PORT:-3000}:${PORT:-3000}"

  # KNOB — accessory service(s). MySQL shown as the worked example; swap for postgres:17,
  # redis:7, etc., or delete this block (and the depends_on / DB_* env above) if the project
  # needs no accessory. No host port is published: the app reaches it over the compose network
  # (DB_HOST: mysql), and NOT publishing keeps parallel per-worktree devcontainers from clashing
  # on the DB host port. For an occasional host-side DB GUI, forward it on demand
  # (`docker compose port mysql 3306`) or add a temporary `ports:` mapping.
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
  bundle-cache:
  mise-data:
