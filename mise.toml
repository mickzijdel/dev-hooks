[tools]
hk = "latest"
pkl = "latest"
gitleaks = "latest"
shellcheck = "latest"
shfmt = "latest"
uv = "latest"     # runs PEP 723 scripts (`uv run --script`) and the pytest suite
ruff = "latest"   # for the *.py skill scripts and tests
node = "latest"            # provides npx, used to run jscpd 5.x (`npx --yes jscpd@latest`)
# jscpd (duplication) runs via npx — see hk.pkl / .jscpd.json (not a mise tool; jscpd 5.x ships
# as a Rust binary via npm optional platform packages that npx resolves but mise's npm backend
# does not). vulture (dead-code) is run via `uvx vulture` — no extra tool needed.

[settings]
# Commit mise.lock so the toolchain installs reproducibly with checksum verification (v2).
lockfile = true

[env]
# dev-env standard version this repo targets (dev-hooks:dev-env-setup). Do not
# hand-edit — bump it by running the skill's upgrade path.
DEV_ENV_VERSION = "6"
